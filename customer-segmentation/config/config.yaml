# ============================================================================
# Customer Segmentation Pipeline - Centralized Configuration
# ============================================================================
# All tunable parameters live here. No magic numbers should appear in code.

project:
  name: "customer-segmentation"
  version: "1.0.0"
  random_seed: 42

data:
  raw_path: "data/raw/Mall_Customers.csv"
  processed_path: "data/processed/customers_clustered.csv"
  # Expected raw schema (validated at load time)
  expected_columns:
    - "CustomerID"
    - "Gender"
    - "Age"
    - "Annual Income (k$)"
    - "Spending Score (1-100)"
  id_column: "CustomerID"
  synthetic:
    enabled_if_missing: true
    n_samples: 200
    n_blobs: 5

features:
  # Features used to drive the clustering, per project decision
  clustering_features:
    - "Age"
    - "Annual Income (k$)"
    - "Spending Score (1-100)"
  scale_features: true

model:
  algorithm: "kmeans"
  n_clusters: 5          # Fixed k, standard choice for this dataset
  init: "k-means++"
  n_init: 10
  max_iter: 300
  random_state: 42

evaluation:
  compute_silhouette: true
  compute_elbow_curve: true   # informational only, k stays fixed at 5
  elbow_k_range: [2, 10]
  generate_pairplot: true
  generate_3d_plot: true

paths:
  model_dir: "outputs/models"
  metrics_dir: "outputs/metrics"
  plots_dir: "outputs/plots"
  log_dir: "outputs/logs"
  model_filename: "kmeans_model.joblib"
  scaler_filename: "scaler.joblib"
  feature_list_filename: "feature_list.json"
  metrics_filename: "metrics.json"
  run_summary_filename: "run_summary.json"
  cluster_profile_filename: "cluster_profiles.json"
  log_filename: "pipeline.log"

logging:
  level: "INFO"
  max_bytes: 1048576       # 1 MB per log file before rotation
  backup_count: 3
  format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
